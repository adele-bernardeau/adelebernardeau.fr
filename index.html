<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f4">
    <title>Adèle Bernardeau — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Michroma&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="house">
      <h1 class="portfolio-name">Adèle Bernardeau</h1>
      <h2 class="home-label">home</h2>
      <svg viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="house-title house-description">
        <title id="house-title">La maison d’Adèle Bernardeau</title>
        <desc id="house-description">Une maison dessinée au trait avec des zones cliquables sur les murs, les fenêtres et la silhouette.</desc>
        <image href="./templates/home/home%20base.jpg" x="0" y="0" width="1500" height="1000" />

        <defs>
          <linearGradient id="blue-window-gradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#4c9fbe" />
            <stop offset="1" stop-color="#79bdd5" />
          </linearGradient>
          <linearGradient id="red-window-gradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d98f7c" />
            <stop offset="1" stop-color="#bd4d31" />
          </linearGradient>
          <clipPath id="wood-front-plane" clipPathUnits="userSpaceOnUse">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M396 289 584 166 584 817 396 817Z M396 601H490V817H396Z" />
          </clipPath>
          <clipPath id="giraffe-wall" clipPathUnits="userSpaceOnUse">
            <rect x="111" y="601" width="379" height="233" />
          </clipPath>
          <filter id="dancer-mask-filter" color-interpolation-filters="sRGB">
            <feColorMatrix
              type="matrix"
              values="-0.2126 -0.7152 -0.0722 0 1
                      -0.2126 -0.7152 -0.0722 0 1
                      -0.2126 -0.7152 -0.0722 0 1
                      0 0 0 1 0"
            />
          </filter>
          <mask id="dancer-silhouette" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="1000" y="716" width="48" height="149" mask-type="luminance">
            <image href="./templates/home/home%20base.jpg" x="0" y="0" width="1500" height="1000" filter="url(#dancer-mask-filter)" />
          </mask>
        </defs>

        <a class="hotspot hotspot--wood" href="./portfolio/marron/IMG_3610.PNG" data-gallery="marron" aria-haspopup="dialog" aria-label="Ouvrir la galerie marron depuis le pan de mur en bois">
          <title>Pan de mur en bois — Architecture</title>
          <path class="hit-area" fill-rule="evenodd" d="M396 289 584 166 584 817 396 817Z M396 601H490V817H396Z" />
          <image class="zone-preview texture-preview" href="./templates/home/home%20bois.jpg" x="0" y="0" width="1500" height="1000" clip-path="url(#wood-front-plane)" />
        </a>

        <a class="hotspot hotspot--giraffe" href="./portfolio/jaune/affiche%20maquette.png" data-gallery="jaune" aria-haspopup="dialog" aria-label="Ouvrir la galerie jaune depuis le mur du rez-de-chaussée">
          <title>Mur du rez-de-chaussée — Texture girafe</title>
          <rect class="hit-area" x="111" y="601" width="379" height="233" />
          <image class="zone-preview texture-preview" href="./templates/home/home%20girafe.jpg" x="0" y="0" width="1500" height="1000" clip-path="url(#giraffe-wall)" />
        </a>

        <a class="hotspot hotspot--blue-window" href="./portfolio/bleu/bleu.jpg" data-gallery="bleu" aria-haspopup="dialog" aria-label="Ouvrir la galerie bleue depuis la fenêtre en haut à gauche">
          <title>Fenêtre en haut à gauche — Maquettes</title>
          <rect class="hit-area" x="302" y="377" width="75" height="199" />
          <path class="zone-preview" fill-rule="evenodd" d="M303 378H375V575H303Z M311 388H365V565H311Z" />
        </a>

        <a class="hotspot hotspot--red-window" href="./portfolio/rouge/DSC01580.JPG" data-gallery="rouge" aria-haspopup="dialog" aria-label="Ouvrir la galerie rouge depuis la fenêtre en haut à droite">
          <title>Fenêtre en haut à droite — Maquettes</title>
          <rect class="hit-area" x="748" y="388" width="361" height="141" />
          <path class="zone-preview" fill-rule="evenodd" d="M748 388H1109V529H748Z M769 400H1092V514H769Z" />
        </a>

        <a class="hotspot hotspot--dancer" href="./portfolio/CV.jpg" data-gallery="cv" aria-haspopup="dialog" aria-label="Ouvrir le CV depuis la silhouette">
          <title>La silhouette — Mouvement</title>
          <rect class="hit-area" x="980" y="700" width="90" height="180" rx="8" />
          <rect class="zone-preview" x="1000" y="716" width="48" height="149" mask="url(#dancer-silhouette)" />
        </a>
      </svg>
    </main>
    <dialog class="lightbox" id="lightbox" aria-labelledby="lightbox-title" aria-describedby="lightbox-count">
      <div class="lightbox__panel">
        <header class="lightbox__header">
          <h2 id="lightbox-title"></h2>
          <button class="lightbox__close" id="lightbox-close" type="button" aria-label="Fermer la galerie">&times;</button>
        </header>
        <div class="lightbox__stage">
          <button class="lightbox__navigation" id="lightbox-previous" type="button" aria-label="Image précédente">
            <span aria-hidden="true">&larr;</span>
          </button>
          <figure class="lightbox__figure">
            <img class="lightbox__image" id="lightbox-image" alt="" decoding="async">
            <figcaption class="lightbox__caption">
              <span id="lightbox-caption"></span>
              <span id="lightbox-count" aria-live="polite" aria-atomic="true"></span>
              <p class="lightbox__error" id="lightbox-error" role="alert" hidden></p>
            </figcaption>
          </figure>
          <button class="lightbox__navigation" id="lightbox-next" type="button" aria-label="Image suivante">
            <span aria-hidden="true">&rarr;</span>
          </button>
        </div>
      </div>
    </dialog>
    <script src="./lightbox.js" defer></script>
  </body>
</html>
